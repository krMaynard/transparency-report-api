# Production stack for the API host.
#
#   API server (self-seeding image) + local Redis + loopback-only Caddy.
#
# Quick start (see DEPLOY-SELFHOST.md for the full runbook):
#   cp .env.example .env         # fill in real production values
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The web and redirect origins are published only on loopback. Cloudflare Tunnel
# is the public ingress; Redis stays entirely on the internal Docker network.
services:
  web:
    build: .
    env_file: .env
    environment:
      # Local Redis (below) replaces Upstash — persists jobs/sessions/keys across
      # restarts and is shared if you ever scale to multiple app replicas.
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    expose:
      - "8080"          # internal only — reached via Caddy, not the host
    ports:
      # Loopback-only origin for Cloudflare Tunnel. This is never reachable
      # from the LAN or public internet; cloudflared runs on the host.
      - "127.0.0.1:18080:8080"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Persist to disk so issued keys / sessions / jobs survive a restart.
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    env_file: .env
    ports:
      # Legacy-host redirect origin for Cloudflare Tunnel; never exposed to LAN.
      - "127.0.0.1:18081:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # Caddy runtime state
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  redis-data:
  caddy-data:
  caddy-config:
