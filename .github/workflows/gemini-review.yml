name: Gemini Review

# Free, self-contained approximation of the (sunsetting) Gemini Code Assist
# review bot: reviews each PR with a Gemini model via the AI Studio free tier
# and posts the result as a single sticky comment (updated in place per push).
#
# Setup: add a repo secret GEMINI_API_KEY (Google AI Studio → Get API key; no
# credit card needed). Until it's set, the job runs but no-ops with a notice —
# it never blocks a PR.

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One review per PR; a new push cancels the in-flight review instead of stacking.
concurrency:
  group: gemini-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # post / update the review comment

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip drafts and Dependabot to conserve the free-tier daily quota.
    if: >-
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so `gh pr diff` resolves the base

      - name: Review the diff with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Free-tier default; swap to gemini-2.5-flash-lite for higher daily
          # quota, or gemini-flash-latest to track the newest free flash model.
          GEMINI_MODEL: gemini-2.5-flash
        run: python3 .github/scripts/gemini_review.py
